# TCS ERP — nginx in front of the Express app container (see docker-compose.yml / docs/DEPLOYMENT.md).
# TLS certificates are read from /etc/nginx/certs (mounted read-only from ./nginx/certs — that
# folder is git-ignored via its own .gitignore; real keys must never be committed).
#
# Expected filenames: fullchain.pem + privkey.pem
#   - Let's Encrypt: copy/symlink from /etc/letsencrypt/live/<domain>/ into nginx/certs/
#   - Quick self-signed pair for testing:
#       openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
#         -keyout nginx/certs/privkey.pem -out nginx/certs/fullchain.pem -subj "/CN=localhost"

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Must exceed the app's 25 MB Express JSON limit (Service photo saves — see server/app.ts)
    client_max_body_size 30m;

    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Login rate limiting reads X-Forwarded-For (api/handlers/auth.ts) — do not remove
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
