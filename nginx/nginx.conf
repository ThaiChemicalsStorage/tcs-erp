# TCS ERP — nginx: HTTPS termination, serves the built frontend, proxies /api to the app container.
# Baked into the web image at build time (Dockerfile, target `web`).
# After editing this file the image must be rebuilt and pushed from a dev machine —
# the server only runs `docker compose pull && docker compose up -d`.
# TLS certificates are read from /etc/nginx/certs (mounted read-only from ./nginx/certs on the
# server — that folder is git-ignored; real keys must never be committed or baked in).
#
# Expected filenames: huma-erp.com.pem (certificate/fullchain) + huma-erp.com.key (private key)

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/huma-erp.com.pem;
    ssl_certificate_key /etc/nginx/certs/huma-erp.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Must exceed the app's 25 MB Express JSON limit (Service photo saves — see server/app.ts)
    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Vite hashes asset filenames, so these can be cached indefinitely
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html — a stale one points at asset hashes that no longer exist
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # คู่มือ + ภาพหน้าจอในคู่มือ: เปิดได้เฉพาะคนที่ล็อกอินแล้ว (เจ้าของสั่ง 2026-10-06, Tuhmo #31)
    # nginx ถาม /api/auth/check (204 = ล็อกอินอยู่ / 401 = ยัง) ด้วยคุกกี้ของคำขอเดิม · ยังไม่ล็อกอินเด้งไปหน้าแรก
    location = /manual.html {
        auth_request /_auth_check;
        error_page 401 403 = @to_login;
        add_header Cache-Control "no-cache";
    }

    location /manual-images/ {
        auth_request /_auth_check;
        error_page 401 403 = @to_login;
        add_header Cache-Control "private, no-cache";
        try_files $uri =404;
    }

    location = /_auth_check {
        internal;
        proxy_pass http://app:3001/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @to_login {
        return 302 /;
    }

    # SPA fallback: deep links like /quotations/123 must return index.html, not 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Login rate limiting reads X-Forwarded-For (api/handlers/auth.ts) — do not remove
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}